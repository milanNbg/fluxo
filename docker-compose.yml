services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo_dev_password
      POSTGRES_DB: fluxo_dev
    ports:
      - "5432:5432"
    volumes:
      - fluxo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fluxo_postgres_data:
    name: fluxo_postgres_data